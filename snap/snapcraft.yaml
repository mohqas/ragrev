name: ragrev
base: core24
version: 'git'
title: RagRev
summary: AI-powered code review tool using Local RAG
description: |
  ragrev is an AI-powered code review tool that uses Local Retrieval-Augmented
  Generation (RAG) to provide context-aware feedback on GitHub Pull Requests.
  It learns from historical review comments to ensure consistency with team
  standards.

  Quick start:
    1. export GITHUB_TOKEN=ghp_...
    2. ragrev init                   # build index from past PR comments
    3. ragrev review 123             # review a PR by number
       ragrev review                 # review unpushed local commits
       ragrev review abc1234         # review a single commit SHA
       ragrev review abc1234:def5678 # review a commit range

  Authenticate by exporting a GITHUB_TOKEN (and, for the Gemini backend, a
  GEMINI_API_KEY) in your environment before running ragrev.

license: GPL-3.0
website: https://github.com/canonical/ragrev
source-code: https://github.com/canonical/ragrev
issues: https://github.com/canonical/ragrev/issues
contact: https://github.com/canonical/ragrev/issues

grade: stable
confinement: strict

apps:
  ragrev:
    command: bin/ragrev
    completer: etc/bash_completion.d/ragrev
    environment:
      TERMINFO: $SNAP/usr/share/terminfo
    plugs:
      - home
      - network
      - network-bind
      - removable-media

parts:
  ragrev:
    plugin: go
    source: .
    build-snaps:
      - go/latest/stable
    override-build: |
      go build -o $CRAFT_PART_INSTALL/bin/ragrev ./cmd/ragrev
      mkdir -p $CRAFT_PART_INSTALL/etc/bash_completion.d
      $CRAFT_PART_INSTALL/bin/ragrev completion bash > $CRAFT_PART_INSTALL/etc/bash_completion.d/ragrev

  editor:
    plugin: nil
    stage-packages:
      - nano
    override-build: |
      craftctl default
      # Don't bundle full vim; instead expose the lightweight `vi`/`vim.tiny`
      # from the base as `vim` so `EDITOR=vim` resolves inside the confined
      # snap. The absolute target resolves to the base snap at runtime, and
      # $SNAP/usr/bin is earlier on PATH so this symlink wins.
      mkdir -p "$CRAFT_PART_INSTALL/usr/bin"
      ln -sf /usr/bin/vi "$CRAFT_PART_INSTALL/usr/bin/vim"
