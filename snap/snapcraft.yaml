name: ragrev
base: core24
version: 'git'
title: RagRev
summary: AI-powered code review tool using Local RAG
description: |
  ragrev is an AI-powered code review tool that uses Local Retrieval-Augmented
  Generation (RAG) to provide context-aware feedback on GitHub Pull Requests.
  It learns from historical review comments to ensure consistency with team
  standards.

  Quick start:
    1. export GITHUB_TOKEN=ghp_...
    2. ragrev init                   # build index from past PR comments
    3. ragrev review 123             # review a PR by number
       ragrev review                 # review unpushed local commits
       ragrev review abc1234         # review a single commit SHA
       ragrev review abc1234:def5678 # review a commit range

  Authenticate by exporting a GITHUB_TOKEN (and, for the Gemini backend, a
  GEMINI_API_KEY) in your environment before running ragrev.

license: GPL-3.0
website: https://github.com/mohqas/ragrev
source-code: https://github.com/mohqas/ragrev
issues: https://github.com/mohqas/ragrev/issues
contact: https://github.com/mohqas/ragrev/issues

grade: stable
confinement: strict

apps:
  ragrev:
    command: bin/ragrev
    completer: etc/bash_completion.d/ragrev
    environment:
      TERMINFO: $SNAP/usr/share/terminfo
      # The bundled vim.basic has a compiled-in runtime path of
      # /usr/share/vim, which under strict confinement resolves to the base
      # snap (no vim runtime), causing "E1187: Failed to source defaults.vim".
      # Point vim at the runtime bundled inside the snap; vim auto-discovers
      # the versioned vimXX subdir, so no version is hard-coded here.
      VIM: $SNAP/usr/share/vim
    plugs:
      - home
      - network
      - network-bind
      - removable-media

parts:
  ragrev:
    plugin: go
    source: .
    build-snaps:
      - go/latest/stable
    override-build: |
      go build -o $CRAFT_PART_INSTALL/bin/ragrev ./cmd/ragrev
      mkdir -p $CRAFT_PART_INSTALL/etc/bash_completion.d
      $CRAFT_PART_INSTALL/bin/ragrev completion bash > $CRAFT_PART_INSTALL/etc/bash_completion.d/ragrev

  editor:
    plugin: nil
    stage-packages:
      - nano
      - vim
    override-build: |
      craftctl default
      # Bundle a full `vim` so `EDITOR=vim` works for users who find the
      # base's lightweight `vi` difficult. The vim package installs the editor
      # as `vim.basic` selected via update-alternatives; that alternatives
      # symlink doesn't survive staging, so create a stable `vim` symlink
      # pointing at the bundled binary. $SNAP/usr/bin is earlier on PATH so
      # this wins over the base's vi.
      mkdir -p "$CRAFT_PART_INSTALL/usr/bin"
      ln -sf vim.basic "$CRAFT_PART_INSTALL/usr/bin/vim"
